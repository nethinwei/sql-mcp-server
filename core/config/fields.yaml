# Help text for every configuration field, in each console language.
#
# Keys are configuration paths ("cost.aqe.timeout"); fields of types emitted
# once under $defs use "defs.<name>.<field>" (see internal/schemagen). Types,
# constraints, defaults and restart markers come from the Go structs in
# core/config, so the text here describes meaning only and does not repeat
# them. `go generate ./core/config` writes schema.json and the field
# reference in docs/configuration.md from this file; tests fail when a field
# has no entry here or an entry has no field.

version:
  title: {zh-CN: '配置版本', en: 'Config version'}
  zh-CN: 配置契约版本标记，当前为 "1"，未写即 "1"；其他取值校验失败，不认识的契约不会被加载。
  en: Configuration contract marker, currently "1"; unset means "1". Any other value fails validation, so a configuration of an unknown contract is never loaded.

server:
  title: {zh-CN: '服务（监听、认证、TLS）', en: 'Server (listen, auth, TLS)'}
  zh-CN: 传输方式、默认身份与 HTTP 认证。
  en: Transport, default identity and HTTP authentication.
server.transport:
  zh-CN: 传输方式；CLI --transport 优先。
  en: Transport; the CLI --transport flag wins.
server.addr:
  zh-CN: HTTP 监听地址；CLI --addr 优先，两处都未设置时为 :8080。非 loopback 地址必须配置 token 或 mTLS。
  en: HTTP listen address; the CLI --addr flag wins, and :8080 applies when neither is set. Non-loopback addresses need a token or mTLS.
server.pathPrefix:
  zh-CN: 网关把服务挂在此路径前缀下并从请求中剥掉它（如 /sql-mcp-server）；控制台的页面、Cookie 与重定向都带上它，网关无需改写响应。修改需重启。
  en: The path a gateway serves this service under and strips from requests (for example /sql-mcp-server); the console's pages, cookie and redirects carry it, so the gateway need not rewrite responses. Changing it needs a restart.
server.publicURL:
  zh-CN: 客户端访问 MCP 端点的完整外部地址（经网关或反向代理时填写，如 https://gw.example.com/sql-mcp/mcp）；控制台据此生成客户端接入配置，未设置时用控制台所在域名加 /mcp。为 https 时控制台会话 Cookie 带 Secure（代理终结 TLS 时）。
  en: The MCP endpoint as clients reach it, through any gateway or reverse proxy (for example https://gw.example.com/sql-mcp/mcp); the console builds client configuration with it, and uses the console's own origin plus /mcp when it is unset. When it is https, the console's session cookie is Secure (a proxy terminating TLS).
server.role:
  zh-CN: 没有用户身份的请求使用的默认角色；CLI --role 覆盖。
  en: Default role for requests without a user identity; the CLI --role flag overrides it.
server.user:
  zh-CN: 没有用户身份的请求使用的默认用户，优先于 role；CLI --user 覆盖。必须是已配置且未禁用的用户。
  en: Default user for requests without a user identity; wins over role, and the CLI --user flag overrides it. Must be a configured, enabled user.
server.sessionTimeout:
  zh-CN: HTTP MCP 会话空闲多久后关闭。关闭时回滚会话内的显式事务、清空会话预算计数；之后客户端用旧会话请求得到 404 并自动建立新会话。修改需重启。
  en: How long an idle HTTP MCP session lives. Closing it rolls back its explicit transactions and clears its session budget; a client then using it gets 404 and opens a new session. Changing it needs a restart.
server.secrets:
  zh-CN: DSN 中 ${file:...} 占位符的读取限制。
  en: Limits for ${file:...} placeholders in DSNs.
server.secrets.allowedRoots:
  zh-CN: 允许读取 secret 文件的根目录（绝对路径）；符号链接不能逃逸这些目录。不写或写空列表都取默认的 /run/secrets、/var/run/secrets。
  en: Absolute directories secret files may be read from; symbolic links cannot escape them. Unset or empty, the defaults /run/secrets and /var/run/secrets apply.
server.auth:
  zh-CN: HTTP 认证。trustProxyHeaders、trustedProxyCIDRs 与非 loopback 的信任规则见 security.md。
  en: HTTP authentication. Trust rules for proxies and non-loopback listeners are in security.md.
server.auth.token:
  zh-CN: 共享 bearer token，按字面读取（不做 ${ENV} 替换）。监听非 loopback 地址时至少 32 字节（可用 openssl rand -hex 32 生成）。配置用户后各用户使用自己的 token。
  en: Shared bearer token, read literally (no ${ENV} expansion). At least 32 bytes on a listener beyond loopback (openssl rand -hex 32 makes one). Configured users use their own tokens.
server.auth.trustProxyHeaders:
  zh-CN: 信任代理传入的身份头（X-MCP-User / X-MCP-Role / X-MCP-Subject）；需要 trustedProxyCIDRs 或 trustedProxyCertSubjects 认定代理。
  en: Trust identity headers (X-MCP-User / X-MCP-Role / X-MCP-Subject) from a proxy; needs trustedProxyCIDRs or trustedProxyCertSubjects to tell proxies.
server.auth.trustedProxyCIDRs:
  zh-CN: 允许传入身份头的代理地址段。
  en: Proxy address ranges allowed to send identity headers.
server.auth.trustedProxyCertSubjects:
  zh-CN: mTLS 下允许传入身份头的代理客户端证书（叶证书 CN 或 DNS SAN，精确匹配）；其它客户端证书带身份头返回 403。
  en: Under mTLS, the proxies' client certificates (leaf CN or DNS SAN, exact) allowed to send identity headers; other certificates sending them get 403.
server.auth.tls:
  zh-CN: TLS / mTLS。cert 与 key 必须同时设置。
  en: TLS / mTLS. Set cert and key together.
server.auth.tls.cert:
  zh-CN: TLS 证书文件路径。
  en: TLS certificate file.
server.auth.tls.key:
  zh-CN: TLS 私钥文件路径。
  en: TLS private key file.
server.auth.tls.clientCA:
  zh-CN: 设置后开启 mTLS，要求并校验客户端证书。
  en: Enables mTLS; client certificates are required and verified.
server.auth.tls.clientIdentity:
  zh-CN: 配置了用户时，只出示客户端证书、不带 bearer token 的请求以谁的身份调用。user（默认）：证书须匹配某个用户的 certSubjects，否则拒绝（401）；default：使用默认身份（server.user 或 server.role，v0.1.20 之前的行为）。未配置用户时不起作用。受信代理的证书不受此限制。
  en: 'With users configured, who a request presenting a client certificate without a bearer token calls as. user (default): the certificate must match a user''s certSubjects, else it is refused (401); default: the default identity (server.user or server.role, the behavior before v0.1.20). No effect without users. Trusted proxies'' certificates are exempt.'

database:
  zh-CN: 旧式单数据源配置，加载时迁移为名为 default 的数据源。需要 database 或至少一个 databases 项，两者不能同时设置。
  en: Legacy single datasource, migrated to the datasource named default. Either database or at least one databases entry is required, not both.
databases:
  zh-CN: 数据源名称到连接配置的映射。
  en: Datasource name to connection.
defs.database:
  zh-CN: 一个数据源连接。validate 会确认 driver 已注册，但不会建立连接。
  en: One datasource connection. validate checks that the driver is registered without connecting.
defs.database.driver:
  zh-CN: 数据库驱动；内置 postgres、mysql、oceanbase，扩展程序可注册其他名称。
  en: Database driver; postgres, mysql and oceanbase are built in, and extensions may register more.
defs.database.dsn:
  zh-CN: 连接串，可包含 ${ENV} 或 ${file:/path} 占位符（仅 DSN 解析占位符；file 路径须在 server.secrets.allowedRoots 下）。单个连接的简写，与 connections 二选一。
  en: Connection string; may contain ${ENV} or ${file:/path} placeholders (only DSNs expand them, and file paths must be under server.secrets.allowedRoots). Shorthand for a single connection; set either this or connections.
defs.database.connections:
  zh-CN: 同一数据库的多个连接（如权限不同的账号、只读副本），按名称索引；与 dsn 二选一。多个连接时须配置 routing。
  en: Several connections to the same database (such as accounts with different privileges, or read replicas), by name; set either this or dsn. Several connections need routing.
defs.database.connections.dsn:
  zh-CN: 连接串，占位符规则同 dsn。
  en: Connection string, with the same placeholder rules as dsn.
defs.database.connections.role:
  zh-CN: primary（默认）或 replica；replica 只承担读取。
  en: primary (the default) or replica; a replica serves reads only.
defs.database.connections.pooler:
  zh-CN: 连接经过事务模式的连接池（pgbouncer、ProxySQL）时设为 transaction：不使用预编译语句等会话状态，语句超时改由请求上下文取消。
  en: transaction when the connection goes through a transaction-mode pooler (pgbouncer, ProxySQL); no session state such as prepared statements is kept, and statement timeouts come from request cancellation.
defs.database.routing:
  zh-CN: 各类动作使用的连接；只有一个连接时可省略。
  en: The connection each kind of action uses; may be omitted with a single connection.
defs.database.routing.read:
  zh-CN: 读取、聚合、EXPLAIN 与只读事务使用的连接。
  en: Connection for reads, aggregates, EXPLAIN and read-only transactions.
defs.database.routing.write:
  zh-CN: 新增、修改、删除与读写事务使用的连接；不能是 replica。
  en: Connection for creates, updates, deletes and read-write transactions; not a replica.
defs.database.routing.execute:
  zh-CN: 存储过程使用的连接；不能是 replica。
  en: Connection for procedure calls; not a replica.
defs.database.readAfterWrite:
  zh-CN: 同一会话写入后，在这段时间内的读取改走 write 连接，以便在副本上读到自己的写入；0 表示不切换，最长 1h。窗口内该会话的读取不与其他会话共享结果。
  en: For this long after a session writes, its reads use the write connection, so it reads its own writes despite replica lag; 0 disables it, at most 1h. Within the window the session's reads share no results with other sessions.
defs.database.sqlEscape:
  zh-CN: 声明后该数据源允许可信 SQL 逃生通道（execute_sql）；省略即不允许，任何权限都不能对它执行任意 SQL。
  en: Declares that the datasource admits the trusted SQL escape hatch (execute_sql); omitted, no permission runs SQL on it.
defs.database.sqlEscape.connection:
  zh-CN: 逃生通道使用的连接名；该账号的数据库权限就是逃生通道的上限，服务不解析、不改写、不脱敏 SQL。建议使用独立账号。
  en: Connection the escape hatch runs on; its account's database privileges bound the hatch, as the SQL is run as it is (no parsing, rewriting or masking). A dedicated account is recommended.

entities:
  zh-CN: 显式暴露给 Agent 的实体；可以为空。启动自省会拒绝数据库中缺失的表、视图或字段。
  en: Entities exposed to agents; may be empty. Startup introspection rejects tables, views or fields missing from the database.
defs.entity:
  zh-CN: '一个表、视图（含物化视图）或存储过程。一个物理表或视图最多对应一个实体：同一数据源中名称完全相同的重复在校验时拒绝，按默认 schema、大小写规则和服务器身份（多个数据源指向同一库）解析后的重复在启动时拒绝。PostgreSQL 分区表只暴露父表，子分区不导入。'
  en: 'One table, view (including materialized views) or stored procedure. A physical table or view backs at most one entity: identical names on one datasource fail validation, and duplicates resolved through the default schema, case folding or server identity (several datasources on one database) fail at startup. Of a PostgreSQL partitioned table only the parent is exposed; partitions are not imported.'
defs.entity.name:
  zh-CN: 实体名，在同一数据源与 schema 内唯一，不含点；实体的完整标识为 datasource.schema.name。
  en: Entity name, unique within its datasource and schema, without dots; the entity is identified as datasource.schema.name.
defs.entity.source:
  zh-CN: 数据库中的表、视图或过程名；省略时等于 name。不能使用保留前缀 smcp_。
  en: Table, view or procedure in the database; defaults to name. The smcp_ prefix is reserved.
defs.entity.datasource:
  zh-CN: 所在数据源；省略时为 default。
  en: Datasource; default when omitted.
defs.entity.schema:
  zh-CN: 数据库 schema。
  en: Database schema.
defs.entity.kind:
  zh-CN: 实体类型；省略时为 table。
  en: Entity kind; table when omitted.
defs.entity.description:
  zh-CN: 给 Agent 看的实体说明；留空时使用数据库中的表注释（启动或重载时读取）。
  en: Entity description shown to agents; the table comment in the database (read at startup and reload) when empty.
defs.entity.primaryKey:
  zh-CN: '主键字段。表以数据库中的主键为准，这里写的与之不同时启动告警；视图上声明的键只用于读取（keyset 分页、单行读取），不会让修改或删除通过写保护。'
  en: 'Primary key fields. For a table the database''s primary key is authoritative and a differing value here is reported at startup; a key declared on a view serves reads only (keyset paging, single-row reads) and never admits an update or delete past write protection.'
defs.entity.uniqueKeys:
  zh-CN: '唯一键（每个为字段列表），与主键一样可唯一定位一行。表以数据库中的唯一约束与唯一索引为准（部分索引、表达式索引、前缀索引、含可空列的键除外）；视图上声明的唯一键只用于读取。'
  en: 'Unique keys (each a field list) that, like the primary key, identify one row. For a table the database''s unique constraints and indexes are authoritative (except partial, expression and prefix indexes and keys with a nullable column); unique keys declared on a view serve reads only.'
defs.entity.fields:
  zh-CN: 暴露的字段。
  en: Exposed fields.
defs.entity.fields.name:
  zh-CN: 数据库列名。
  en: Database column.
defs.entity.fields.alias:
  zh-CN: 对 Agent 暴露的名称；省略时用列名。
  en: Name exposed to agents; the column name when omitted.
defs.entity.fields.description:
  zh-CN: 给 Agent 看的字段说明；留空时使用数据库中的列注释（启动或重载时读取）。
  en: Field description shown to agents; the column comment in the database (read at startup and reload) when empty.
defs.entity.fields.mask:
  zh-CN: 脱敏规则，只能是内置规则之一，其他值校验失败。脱敏字段只能出现在读取结果中，不能用于过滤、游标、分组、聚合或写谓词。
  en: Masking rule, one of the built-in rules; any other value fails validation. Masked fields only appear in read results, never in filters, cursors, grouping, aggregates or write predicates.
defs.entity.fields.exclude:
  zh-CN: 隐藏该字段，Agent 不可见。
  en: Hide the field from agents.
defs.entity.roles:
  zh-CN: 旧式实体级授权：动作 → 允许的角色。与顶层 roles 合并到同名角色。
  en: 'Legacy entity-level access: action → allowed roles. Merges into top-level roles of the same name.'
defs.entity.roles.read:
  zh-CN: 可读取的角色。
  en: Roles that may read.
defs.entity.roles.create:
  zh-CN: 可新增的角色。
  en: Roles that may create.
defs.entity.roles.update:
  zh-CN: 可修改的角色。
  en: Roles that may update.
defs.entity.roles.delete:
  zh-CN: 可删除的角色。
  en: Roles that may delete.
defs.entity.roles.execute:
  zh-CN: 可执行存储过程的角色。
  en: Roles that may execute the procedure.
defs.entity.roles.aggregate:
  zh-CN: 可聚合统计的角色。
  en: Roles that may aggregate.
defs.entity.fieldACL:
  zh-CN: 旧式角色级字段白名单：角色 → 可读、可写字段。
  en: 'Legacy per-role field allowlists: role → readable and writable fields.'
defs.entity.fieldACL.read:
  zh-CN: 可读字段。
  en: Readable fields.
defs.entity.fieldACL.write:
  zh-CN: 可写字段。
  en: Writable fields.
defs.entity.mcp:
  zh-CN: 实体在 MCP 中的暴露方式。
  en: How the entity takes part in MCP.
defs.entity.mcp.dmlTools:
  zh-CN: 是否加入通用实体工具（读、写、聚合）；省略时为 true，显式 false 会保留。
  en: Whether the generic entity tools (read, write, aggregate) include it; true when omitted, and an explicit false is kept.
defs.entity.mcp.customTool:
  zh-CN: 存储过程额外注册独立 MCP 工具；与 tools.executeEntity 无关。修改可热加载，客户端会收到工具列表变更通知。
  en: Registers a dedicated MCP tool for the procedure; independent of tools.executeEntity. Changes hot-reload, and clients are told the tool list changed.
defs.entity.mcp.trustedProcedure:
  zh-CN: DBA 已审核该过程的权限与内部成本。只有为 true 且 CALL 指纹命中 allowTemplates 时才能执行。
  en: A DBA reviewed the procedure's privileges and internal cost. It runs only when true and its CALL fingerprint is in allowTemplates.
defs.entity.rowPolicies:
  zh-CN: 旧式角色级行范围：角色 → 过滤条件（{op, field, value} 或 and/or 组合）。
  en: 'Legacy per-role row scope: role → filter ({op, field, value} or and/or groups).'
defs.entity.relationships:
  zh-CN: 可展开的关系。当前只支持同数据源内的一层展开。
  en: Expandable relationships. Only one level within the same datasource is supported.
defs.entity.relationships.name:
  zh-CN: 关系名，展开时使用。
  en: Relationship name used when expanding.
defs.entity.relationships.target:
  zh-CN: 目标实体。引用实体可写 name、schema.name、datasource.name 或 datasource.schema.name，须只对应一个实体。
  en: Target entity. Refer to an entity as name, schema.name, datasource.name or datasource.schema.name; it must name exactly one entity.
defs.entity.relationships.cardinality:
  zh-CN: 基数；belongs-to/one 展开为单个对象，has-many/many 展开为列表。
  en: Cardinality; belongs-to/one expand to an object, has-many/many to a list.
defs.entity.relationships.joinOn:
  zh-CN: 连接键：本实体列名 → 目标实体列名（不能写字段别名）；多列外键写多对，全部相等才关联。
  en: 'Join pairs: this entity''s column → the target''s column (not a field alias); a multi-column foreign key lists every pair, all of which must match.'
defs.entity.tenantPolicy:
  zh-CN: 租户硬边界，语法同一条行过滤；对所有主体始终 AND，不参与多角色合并。引用的 ${subject.x} 缺失时匹配零行。
  en: Tenant boundary with row-filter syntax; always ANDed for every principal and never merged across roles. A missing ${subject.x} matches no rows.
defs.entity.params:
  zh-CN: 存储过程参数的固定位置顺序；省略或空表示无参。
  en: Positional parameters of the procedure; omitted or empty means none.
defs.entity.allowCascade:
  zh-CN: '允许级联写入：删除本实体的行或修改其被引用列时，外键的 CASCADE、SET NULL、SET DEFAULT 会改写其他表的行。默认要求调用方对每个被级联的实体都有对应的删除或修改权限，且不带行范围限制；被级联的表未暴露为实体时拒绝。设为 true 则不做该检查，由管理员对级联负责。'
  en: 'Allow cascading writes: deleting this entity''s rows or updating their referenced columns makes foreign keys (CASCADE, SET NULL, SET DEFAULT) rewrite rows of other tables. By default the caller needs delete or update permission without a row scope on every cascaded entity, and a cascade into a table no entity exposes is rejected. true skips the check and leaves the cascade to the administrator.'
defs.entity.allowKeyUpdate:
  zh-CN: 允许 update_records 修改标识行的列（主键；无主键时为第一个可标识行的唯一键）。默认拒绝：改主键会让引用它的行、缓存与审计记录失去对应，应先删除再创建。
  en: 'Lets update_records assign the columns that identify a row (the primary key, else the first unique key that identifies one). Refused by default: a changed key orphans the rows, cached reads and audit records that refer to it; delete the row and create it again instead.'
defs.entity.affects:
  zh-CN: 存储过程会写入的实体（须与过程同一数据源，引用写法同 grants），用于读缓存失效；省略时过程执行后失效该数据源的全部缓存。
  en: Entities the procedure writes (on its datasource, referred to as in grants), for read-cache invalidation; when omitted, every cached read of the datasource is invalidated after it runs.

roles:
  zh-CN: 顶层角色：角色名 → 授权。名称规范化为小写。
  en: 'Top-level roles: name → grants. Names are lowercased.'
defs.role:
  zh-CN: 一个角色。
  en: One role.
defs.role.description:
  zh-CN: 角色说明。
  en: Role description.
defs.role.grants:
  zh-CN: 角色的授权项。
  en: The role's grants.
defs.role.permissions:
  zh-CN: 系统权限。sql:execute@<datasource> 让角色的用户在该数据源（须已配置且声明 sqlEscape）使用 execute_sql；其他系统权限为后续版本预留，本版声明即校验失败。
  en: System permissions. sql:execute@<datasource> admits the role's users to execute_sql on that datasource (which must exist and declare sqlEscape); other system permissions are reserved and fail validation in this version.
defs.role.limits:
  zh-CN: 角色的资源限制，收紧全局限制。未设置的项沿用全局值；设置的项只能更严（取两者中更严的值）。用户有多个角色时，每项取各角色中最宽松的值（任一角色未设置即不限）。
  en: Resource limits of the role, tightening the global ones. An unset field keeps the global value; a set one can only tighten it (the stricter of the two applies). With several roles, each field is the most permissive of the user's roles (a role leaving it unset leaves it unset).
defs.role.limits.maxRows:
  zh-CN: 单次请求最多返回的行数（全局 cost.maxRows）。
  en: Rows a call returns at most (global cost.maxRows).
defs.role.limits.maxBytes:
  zh-CN: 单次请求最多返回的字节数（全局 cost.maxBytes）。
  en: Bytes a call returns at most (global cost.maxBytes).
defs.role.limits.maxScannedRows:
  zh-CN: 单次请求的语句最多预计读取的行数（全局 cost.maxScannedRows）。
  en: Rows a call's statement may be estimated to read at most (global cost.maxScannedRows).
defs.role.limits.queryTimeout:
  zh-CN: 单次请求的查询超时（全局 cost.queryTimeout）。
  en: Query timeout of a call (global cost.queryTimeout).
defs.role.limits.softScore:
  zh-CN: 成本闸门软拒绝分数（全局 cost.softScore）；分数越高越严。
  en: The cost gate's soft rejection score (global cost.softScore); higher is stricter.
defs.role.limits.hardScore:
  zh-CN: 成本闸门硬拒绝分数（全局 cost.hardScore）；分数越高越严。
  en: The cost gate's hard rejection score (global cost.hardScore); higher is stricter.
defs.role.limits.rejectFullScan:
  zh-CN: 拒绝全表扫描（全局 cost.rejectFullScan 已开启时始终拒绝）。
  en: Reject full scans (always rejected when the global cost.rejectFullScan is on).
defs.role.limits.rps:
  zh-CN: 每秒请求数上限，按调用者（用户或角色）跨会话计；超出时返回 RATE_LIMITED。进程级 rateLimit.rps 仍同时生效。
  en: Requests per second, per caller (user or role) across its sessions; past it a call is refused with RATE_LIMITED. The process-wide rateLimit.rps still applies.
defs.role.limits.maxInflight:
  zh-CN: 同时进行的请求数上限，按调用者跨会话计；超出时返回 RATE_LIMITED。
  en: Requests in flight at once, per caller across its sessions; past it a call is refused with RATE_LIMITED.
defs.role.limits.budget:
  zh-CN: 会话预算（含义同 budget.*）；设置的项优先于 budget.roles 与 budget.users。
  en: Session budget (as budget.*); a field set wins over budget.roles and budget.users.
defs.grant:
  zh-CN: 一条实体授权。一次请求只使用覆盖其全部字段的授权项，它们的行范围取 OR，再 AND 实体 tenantPolicy。
  en: One entity grant. A request uses only the grants covering all its fields; their row scopes are ORed and then ANDed with the entity tenantPolicy.
defs.grant.entity:
  zh-CN: 授权的实体。引用实体可写 name、schema.name、datasource.name 或 datasource.schema.name，须只对应一个实体。
  en: Entity granted. Refer to an entity as name, schema.name, datasource.name or datasource.schema.name; it must name exactly one entity.
defs.grant.actions:
  zh-CN: 允许的动作。
  en: Allowed actions.
defs.grant.fields:
  zh-CN: 字段范围；省略表示全部可见字段（含以后新增的字段）。
  en: Field scope; every visible field (including ones added later) when omitted.
defs.grant.fields.read:
  zh-CN: 可读字段。
  en: Readable fields.
defs.grant.fields.write:
  zh-CN: 可写字段。
  en: Writable fields.
defs.grant.rows:
  zh-CN: 行范围，语法同行过滤；省略表示不限制。
  en: Row scope with row-filter syntax; unrestricted when omitted.

users:
  zh-CN: 通过 HTTP 访问的调用方：用户名 → 配置。增删、禁用、轮换 token，以及首次配置或删除全部用户，均可热加载。
  en: 'HTTP callers: name → user. Adding, removing, disabling and rotating tokens, and configuring the first user or removing all users, hot-reload.'
defs.user:
  zh-CN: 一个用户。有效权限为各角色授权与直授 grants 的并集。
  en: One user. Effective access is the union of the role grants and direct grants.
defs.user.description:
  zh-CN: 用户说明。
  en: User description.
defs.user.certSubjects:
  zh-CN: 在 mTLS 下认证该用户的客户端证书：cn:<CN>、dns:<DNS SAN>、uri:<URI SAN，如 SPIFFE ID>、email:<邮件 SAN>。证书任一项匹配即为该用户；各用户之间不能重复，也不能是受信代理的证书主体。带 bearer token 的请求以 token 为准。
  en: 'Client certificates that authenticate the user under mTLS: cn:<CN>, dns:<DNS SAN>, uri:<URI SAN, such as a SPIFFE ID> or email:<email SAN>. A certificate matching any of them is the user; each names one user and no trusted proxy. A request with a bearer token is the token''s.'
defs.user.tokenHash:
  zh-CN: bearer token 的 sha256 hash，由 sql-mcp-server user token 生成；明文不进入配置。各用户之间、与 server.auth.token 之间不能重复。
  en: sha256 hash of the bearer token, from sql-mcp-server user token; the plaintext never enters the configuration. Must differ between users and from server.auth.token.
defs.user.roles:
  zh-CN: 用户拥有的角色，可以是顶层角色或实体级授权中出现的角色名。
  en: 'The user''s roles: top-level roles or role names used in entity-level access.'
defs.user.subject:
  zh-CN: 固定的主体属性，供 ${subject.x} 解析；优先于代理 X-MCP-Subject 中的同名属性。
  en: Fixed subject attributes for ${subject.x}; wins over the same attributes in a proxy's X-MCP-Subject.
defs.user.grants:
  zh-CN: 只给这个用户的直授授权。
  en: Grants for this user only.
defs.user.permissions:
  zh-CN: 只给这个用户的系统权限，与角色的 permissions 取并集；取值同角色的 permissions。
  en: System permissions for this user only, united with the roles' permissions; same values as a role's permissions.
defs.user.disabled:
  zh-CN: 禁用后无法认证，也不能作为 server.user；会话立即解除。
  en: A disabled user cannot authenticate or be server.user; its sessions end immediately.
defs.user.limits:
  zh-CN: 用户的资源限制，收紧全局限制。未设置的项沿用全局值；设置的项只能更严（取两者中更严的值）。设置的项优先于其各角色的设置。
  en: Resource limits of the user, tightening the global ones. An unset field keeps the global value; a set one can only tighten it (the stricter of the two applies). A field set wins over the user's roles.
defs.user.limits.maxRows:
  zh-CN: 单次请求最多返回的行数（全局 cost.maxRows）。
  en: Rows a call returns at most (global cost.maxRows).
defs.user.limits.maxBytes:
  zh-CN: 单次请求最多返回的字节数（全局 cost.maxBytes）。
  en: Bytes a call returns at most (global cost.maxBytes).
defs.user.limits.maxScannedRows:
  zh-CN: 单次请求的语句最多预计读取的行数（全局 cost.maxScannedRows）。
  en: Rows a call's statement may be estimated to read at most (global cost.maxScannedRows).
defs.user.limits.queryTimeout:
  zh-CN: 单次请求的查询超时（全局 cost.queryTimeout）。
  en: Query timeout of a call (global cost.queryTimeout).
defs.user.limits.softScore:
  zh-CN: 成本闸门软拒绝分数（全局 cost.softScore）；分数越高越严。
  en: The cost gate's soft rejection score (global cost.softScore); higher is stricter.
defs.user.limits.hardScore:
  zh-CN: 成本闸门硬拒绝分数（全局 cost.hardScore）；分数越高越严。
  en: The cost gate's hard rejection score (global cost.hardScore); higher is stricter.
defs.user.limits.rejectFullScan:
  zh-CN: 拒绝全表扫描（全局 cost.rejectFullScan 已开启时始终拒绝）。
  en: Reject full scans (always rejected when the global cost.rejectFullScan is on).
defs.user.limits.rps:
  zh-CN: 每秒请求数上限，按调用者（用户或角色）跨会话计；超出时返回 RATE_LIMITED。进程级 rateLimit.rps 仍同时生效。
  en: Requests per second, per caller (user or role) across its sessions; past it a call is refused with RATE_LIMITED. The process-wide rateLimit.rps still applies.
defs.user.limits.maxInflight:
  zh-CN: 同时进行的请求数上限，按调用者跨会话计；超出时返回 RATE_LIMITED。
  en: Requests in flight at once, per caller across its sessions; past it a call is refused with RATE_LIMITED.
defs.user.limits.budget:
  zh-CN: 会话预算（含义同 budget.*）；设置的项优先于 budget.roles 与 budget.users。
  en: Session budget (as budget.*); a field set wins over budget.roles and budget.users.

tools:
  title: {zh-CN: '工具开关', en: 'Tool switches'}
  zh-CN: 省略整个块时开启读取、聚合、过程与事务工具，写工具（createRecord、updateRecord、deleteRecord）关闭（v0.1.20 起；此前 createRecord、updateRecord 默认开启）；一旦写出该块，未写的工具保持关闭。
  en: 'Omitting the block enables the reading, aggregating, procedure and transaction tools and leaves the writing tools (createRecord, updateRecord, deleteRecord) off (since v0.1.20; createRecord and updateRecord were on before); once the block is written, unlisted tools stay off.' 
tools.describeEntities:
  zh-CN: 列出可访问的实体与字段。
  en: Lists the entities and fields the caller can access.
tools.readRecords:
  zh-CN: read_records：按条件读取记录。
  en: 'read_records: read records by filter.'
tools.createRecord:
  zh-CN: create_record：新增记录。
  en: 'create_record: insert a record.'
tools.updateRecord:
  zh-CN: update_record：按主键修改记录。
  en: 'update_record: update a record by primary key.'
tools.deleteRecord:
  zh-CN: delete_record：按主键删除记录。
  en: 'delete_record: delete a record by primary key.'
tools.executeEntity:
  zh-CN: execute_entity：执行存储过程实体。不影响实体 mcp.customTool 注册的独立工具。
  en: 'execute_entity: run procedure entities. Does not affect tools registered by mcp.customTool.'
tools.aggregateRecords:
  zh-CN: aggregate_records：分组统计。
  en: 'aggregate_records: grouped aggregates.'
tools.executeSql:
  zh-CN: execute_sql：可信 SQL 逃生通道，默认关闭。开启后还须用户持有 sql:execute@<datasource> 且数据源声明 sqlEscape；未授权用户在 tools/list 中看不到它。开启要求 audit.enabled。
  en: 'execute_sql: the trusted SQL escape hatch, off by default. A user also needs sql:execute@<datasource> and the datasource its sqlEscape; unauthorized users do not see it in tools/list. Requires audit.enabled.'
tools.beginTransaction:
  zh-CN: 开启事务。
  en: Begin a transaction.
tools.commitTransaction:
  zh-CN: 提交事务。
  en: Commit a transaction.
tools.rollbackTransaction:
  zh-CN: 回滚事务。
  en: Roll back a transaction.

cost:
  title: {zh-CN: '成本闸门与输入上限', en: 'Cost gate and input limits'}
  zh-CN: 执行前的成本闸门与输入上限。
  en: Pre-execution cost gate and input limits.
cost.enabled:
  zh-CN: 是否启用基于 EXPLAIN 的成本闸门。不影响 requirePKForWrite。
  en: EXPLAIN-based cost gate. Does not affect requirePKForWrite.
cost.softScore:
  zh-CN: 安全分（越高越安全）低于它时软拒绝，并返回缩小查询的提示；需 ≥ hardScore。
  en: Below this safety score (higher is safer) the call is soft-rejected with hints to narrow it; must be ≥ hardScore.
cost.hardScore:
  zh-CN: 安全分低于它时直接拒绝。
  en: Reject below this safety score.
cost.maxRows:
  zh-CN: 读取 SQL 的外层 LIMIT。
  en: Outer LIMIT for reads.
cost.maxBytes:
  zh-CN: 单次响应的字节上限。
  en: Response size cap in bytes.
cost.maxScannedRows:
  zh-CN: 语句预计读取的行数超过它即拒绝，不论是否用到索引；0 表示不限。读取行数取 EXPLAIN 中最大的行数估计（MySQL rows_examined_per_scan，PostgreSQL 与 OceanBase 各节点的行数），全表扫描时取表的行数；表的行数未能测得的全表扫描读取行数未知，即拒绝（可对该表运行 ANALYZE）。角色或用户的 limits.maxScannedRows 只能收紧；与预算 maxEstimatedScannedRows 同时生效。
  en: Refuse a statement estimated to read more rows than this, whatever its access path; 0 is unlimited. The rows read are the largest row estimate of the EXPLAIN (MySQL rows_examined_per_scan, PostgreSQL and OceanBase each node's rows), and a full scan's table size; a full scan of a table whose size could not be measured reads an unknown number of rows and is refused (run ANALYZE on the table). A role's or user's limits.maxScannedRows only tightens it; the budget's maxEstimatedScannedRows applies as well.
cost.maxINListSize:
  zh-CN: IN 列表最多元素数，关系展开也按它分批。
  en: Maximum IN-list size; relationship expansion batches by it.
cost.maxFilterConditions:
  zh-CN: 一次请求最多过滤条件数。
  en: Maximum filter conditions per request.
cost.maxGroupByFields:
  zh-CN: 最多分组字段数。
  en: Maximum group-by fields.
cost.maxAggregates:
  zh-CN: 最多聚合表达式数。
  en: Maximum aggregate expressions.
cost.maxExpand:
  zh-CN: 最多展开的关系数。
  en: Maximum expanded relationships.
cost.maxProcedureRows:
  zh-CN: 存储过程结果行数上限。
  en: Row cap for procedure results.
cost.rejectFullScan:
  zh-CN: 拒绝全表扫描（表本身不超过 fullScanMaxRows 行的小表除外）。
  en: Reject full table scans (except of small tables, see fullScanMaxRows).
cost.fullScanMaxRows:
  zh-CN: 被全表扫描的表本身不超过此行数时（配置表、维表，包括被连接的），按索引扫描评分、不被 rejectFullScan 拒绝。按表的规模判断而不是计划的输出行数（PostgreSQL 取 pg_class 统计、MySQL 取 rows_examined_per_scan、OceanBase 取 EXPLAIN EXTENDED 的 table_rows），任何一张全表扫描的表得不到行数时都不豁免；0 表示全表扫描一律按全表扫描处理。
  en: A full scan of tables of no more than this many rows (lookup and dimension tables, joined ones included) scores as an index scan and is not rejected by rejectFullScan. The size is the table's, not the plan's output (PostgreSQL pg_class statistics, MySQL rows_examined_per_scan, OceanBase EXPLAIN EXTENDED table_rows); without it nothing is exempted. 0 treats every full scan as one.
cost.whitelistPKPoint:
  zh-CN: 主键点查询跳过估算（仍受结果上限约束）。
  en: Primary-key point reads skip estimation (result caps still apply).
cost.requirePKForWrite:
  zh-CN: 写操作必须带主键条件；不随 cost.enabled 关闭，allowTemplates 也不能放行。
  en: Writes must filter by primary key; not turned off by cost.enabled, nor bypassed by allowTemplates.
cost.requireKnownScan:
  zh-CN: 无法判断扫描方式时拒绝；MySQL/OceanBase 的 EXPLAIN 失败即拒绝。
  en: Reject when the scan type is unknown; on MySQL/OceanBase a failed EXPLAIN rejects.
cost.requireFreshStats:
  zh-CN: 统计信息过旧时拒绝（未开启时只在评分中扣 15 分）。PostgreSQL 中过旧指被扫描的表既没被 ANALYZE 也没被 autovacuum 分析过，且大于 64 KiB；MySQL、OceanBase 不判断。
  en: Reject when table statistics are stale (otherwise they only lower the score by 15). On PostgreSQL a scanned table is stale when neither ANALYZE nor autovacuum analyzed it and it is larger than 64 KiB; MySQL and OceanBase do not tell.
cost.queryTimeout:
  zh-CN: 查询超时，0（不限）或不小于 100ms；数据库语句超时取其九成（至多短 1 秒），使数据库先停住语句。0 时请求没有时限，也不下发数据库语句超时（数据库与账号自身的默认值仍然生效），开启 requireNativeLimits 时拒绝该配置。
  en: Query timeout, 0 (none) or at least 100ms; the database statement timeout is set a tenth shorter (at most a second), so the database stops the statement first. At 0 calls have no deadline and no database statement timeout is set (the database's and the account's own defaults still apply); requireNativeLimits then refuses the configuration.
cost.requireNativeLimits:
  zh-CN: 严格模式：数据源的连接无法在数据库侧把语句限制在 queryTimeout 内（能力不是 enforced）时，拒绝加载该配置，控制台校验也报错；关闭时只告警。
  en: Strict mode. Refuse the configuration when a datasource's connection cannot stop statements at queryTimeout on the database side (the capability is not enforced), and fail its validation in the console; off, it only warns.
cost.allowTemplates:
  zh-CN: 受治理工具中跳过估算的 SQL 模板：推荐 fp:v4:<sha256> 指纹；多数据源下精确 SQL 写成 datasource:SQL。不绕过安全检查；不作用于 execute_sql（其估算见 cost.sqlEscape）。
  en: SQL templates of the governed tools that skip estimation; prefer fp:v4:<sha256> fingerprints, and with several datasources write exact SQL as datasource:SQL. Safety checks still apply; execute_sql is not affected (see cost.sqlEscape for its estimate).
cost.rejectTemplates:
  zh-CN: 受治理工具中总是拒绝的 SQL 模板，写法同 allowTemplates。按精确文本或指纹匹配，不是 SQL 语义级黑名单；不作用于 execute_sql（逃生通道的边界是其连接账号的权限）。
  en: SQL templates of the governed tools that are always rejected; same forms as allowTemplates. Matched by exact text or fingerprint, not a semantic SQL blocklist; execute_sql is not affected (the escape hatch is bounded by its connection's privileges).
cost.aqe:
  zh-CN: 基于实际执行反馈的自适应估算与可选的 EXPLAIN ANALYZE 采样。
  en: Adaptive estimation from execution feedback, with optional EXPLAIN ANALYZE sampling.
cost.aqe.windowSize:
  zh-CN: 每个模板保留的反馈样本数。
  en: Feedback samples kept per template.
cost.aqe.anomalyFactor:
  zh-CN: 实际与估算偏差超过该倍数视为异常。
  en: Actual/estimate ratio treated as an anomaly.
cost.aqe.anomalyMinSamples:
  zh-CN: 判断异常前至少需要的样本数。
  en: Samples needed before flagging anomalies.
cost.aqe.explainAnalyze:
  zh-CN: 对采样读取额外执行 EXPLAIN (ANALYZE, BUFFERS)。仅 PostgreSQL；缓存命中不采样。
  en: Run EXPLAIN (ANALYZE, BUFFERS) on sampled reads. PostgreSQL only; cache hits are not sampled.
cost.aqe.readOnly:
  zh-CN: 采样只在只读事务中执行并回滚；启用采样时必须为 true。
  en: Sample only in read-only transactions that roll back; must be true when sampling.
cost.aqe.sampleRate:
  zh-CN: 采样比例；0 不采样，1 每次成功读取都采样。
  en: Sampling ratio; 0 never samples, 1 samples every successful read.
cost.aqe.timeout:
  zh-CN: 采样超时，独立于主查询；启用采样时必须大于 0。
  en: Sampling timeout, separate from the main query; must be above 0 when sampling.
cost.aqe.maxFingerprints:
  zh-CN: 全局最多跟踪的模板数。
  en: Maximum templates tracked globally.
cost.sqlEscape:
  zh-CN: execute_sql 的估算策略。超时、行数与字节上限、并发与预算是不可关闭的硬上限，这里只决定 EXPLAIN 估算。
  en: The estimate policy of execute_sql. Timeout, row and byte caps, concurrency and budgets are hard limits that cannot be switched off; this only decides the EXPLAIN estimate.
cost.sqlEscape.estimate:
  zh-CN: required（默认）：每条语句先 EXPLAIN，无法估算（DDL、SET、SHOW 等）或超出阈值即拒绝；skip：不估算，只保留硬上限。cost.enabled 为 false 或数据源没有 EXPLAIN 时，须显式写 skip，否则配置被拒绝。
  en: 'required (the default): every statement is EXPLAINed first and refused when it cannot be estimated (DDL, SET, SHOW) or exceeds the thresholds; skip: no estimate, the hard limits alone. With cost.enabled false or a datasource without EXPLAIN, skip must be written out, or the configuration is refused.'
cost.sqlEscape.metadata:
  zh-CN: allow（默认）：query 模式下的单条 SHOW、DESCRIBE、DESC 语句不做 EXPLAIN 估算，只受硬上限约束（按语句开头识别，不解析 SQL）；refuse：与其他无法估算的语句一样，在 estimate 为 required 时拒绝。
  en: 'allow (the default): a single SHOW, DESCRIBE or DESC statement in query mode runs without an EXPLAIN estimate, under the hard limits alone (recognized by how it begins; SQL is not parsed); refuse: refused like any statement EXPLAIN cannot estimate while estimate is required.'

budget:
  title: {zh-CN: '预算', en: 'Budgets'}
  zh-CN: 按 MCP 会话隔离的资源预算，进程内有界状态；0 表示不限。
  en: Per-MCP-session resource budgets kept in bounded process memory; 0 means unlimited.
budget.roles:
  zh-CN: 按角色的预算：角色名 → 限额。
  en: 'Budgets by role: name → limits.'
budget.tenants:
  zh-CN: 按租户的预算。maxConcurrent 约束该租户所有会话、所有主体的调用合计；其余各项逐字段收紧角色或用户的限额（取两者中已设置的较小值，租户未设置的项沿用角色的）。租户取自 subject 的 tenant / tenant_id / tenantID。
  en: >-
    Budgets by tenant. maxConcurrent bounds the calls of all the tenant's sessions and principals together; the
    other limits tighten the role or user limits field by field (the smaller of the set values applies, and a limit
    the tenant leaves unset keeps the role's). The tenant comes from subject tenant / tenant_id / tenantID.
budget.users:
  zh-CN: 按用户的预算，优先于角色；未配置时逐项取其各角色中最宽松的值（任一角色未配置即视为不限）。
  en: Budgets by user; win over roles. Without one, each limit is the most permissive of the user's roles (a role without a budget means unlimited).
defs.budgetLimits:
  zh-CN: 一组预算限额；0 表示不限。
  en: A set of budget limits; 0 means unlimited.
defs.budgetLimits.maxConcurrent:
  zh-CN: 同时执行的请求数上限。
  en: Concurrent requests.
defs.budgetLimits.maxExecution:
  zh-CN: 单次执行时长上限。
  en: Execution time per call.
defs.budgetLimits.maxEstimatedScannedRows:
  zh-CN: 单次调用的估算（及实际）扫描行数上限。
  en: Estimated (and actual) scanned rows per call.
defs.budgetLimits.maxReturnedRows:
  zh-CN: 单次调用返回行数上限。
  en: Rows returned per call.
defs.budgetLimits.maxReturnedBytes:
  zh-CN: 单次调用返回字节上限。
  en: Bytes returned per call.
defs.budgetLimits.maxSessionCost:
  zh-CN: 会话累计成本上限。
  en: Cost per session.

cache:
  title: {zh-CN: '缓存', en: 'Cache'}
  zh-CN: 读取结果缓存；条目数和单条大小始终有界。下表默认值是启用缓存后的取值。
  en: Read result cache; entry count and size are always bounded. The defaults below apply once the cache is enabled.
cache.enabled:
  zh-CN: 是否启用读取缓存。
  en: Enable the read cache.
cache.ttl:
  zh-CN: 缓存有效期。
  en: Entry lifetime.
cache.maxSize:
  zh-CN: 最多缓存条目数。
  en: Maximum entries.
cache.maxEntryRows:
  zh-CN: 单条缓存最多行数；默认等于 cost.maxRows，启用结果缓存时必须大于 0。
  en: Maximum rows per entry; defaults to cost.maxRows and must be positive when the result cache is enabled.
cache.maxEntryBytes:
  zh-CN: 单条缓存最多字节数；默认等于 cost.maxBytes，启用结果缓存时必须大于 0。
  en: Maximum bytes per entry; defaults to cost.maxBytes and must be positive when the result cache is enabled.
cache.maxTotalBytes:
  zh-CN: 结果缓存所有条目合计最多字节数，超出时先淘汰最早过期的条目；默认 256 MiB（不小于 maxEntryBytes），启用结果缓存时不能小于 maxEntryBytes。
  en: Maximum bytes of all result cache entries together; past it the entries closest to expiry go first. Defaults to 256 MiB (at least maxEntryBytes) and must hold one entry of maxEntryBytes when the result cache is enabled.
cache.preparedMaxSize:
  zh-CN: 预编译语句缓存条目数，与结果缓存相互独立；0 表示不缓存。
  en: Prepared statement cache size, independent of the result cache; 0 disables it.

rateLimit:
  title: {zh-CN: '限流与熔断', en: 'Rate limits and breakers'}
  zh-CN: 并发控制、限流、熔断与连接池。
  en: Concurrency control, rate limiting, circuit breaking and the connection pool.
rateLimit.enabled:
  zh-CN: 是否启用。
  en: Enable rate limiting.
rateLimit.rps:
  zh-CN: 每秒请求数上限（令牌桶）；0 表示只做并发限制。
  en: Requests per second (token bucket); 0 limits concurrency only.
rateLimit.maxInflight:
  zh-CN: 同时进行的请求上限。
  en: Requests in flight.
rateLimit.ioPool:
  zh-CN: IO 工作池大小；普通执行使用它。
  en: IO worker pool size, used by ordinary execution.
rateLimit.minConcurrency:
  zh-CN: 自适应并发的下限（每个数据库连接各自调整）。
  en: Lower bound of adaptive concurrency (adjusted per database connection).
rateLimit.rttThreshold:
  zh-CN: 延迟超过该值时降低并发；0s 不触发。
  en: Reduce concurrency when latency exceeds this; 0s disables it.
rateLimit.breakerThreshold:
  zh-CN: 连续失败多少次后熔断；每个数据库连接各自熔断。只计数据库或连接自身的故障（含数据库的语句超时）；调用方取消，以及数据库因数据、取值、权限、语句本身（如语法）或已变化的 schema 拒绝的语句不计入。
  en: >-
    Consecutive failures that open the breaker; each database connection has its own. Only the database's or
    the connection's own failures count (its statement timeouts included); calls the caller cancelled, and
    statements the database refused for their data, values, privileges, their own text (a syntax error) or a
    schema that changed, do not.
rateLimit.breakerCooldown:
  zh-CN: 熔断后多久重试；冷却后只放行一个探测调用，成功才恢复。
  en: Time before retrying after the breaker opens; one probe call is then let through, and only its success closes it.
rateLimit.maxResultMemory:
  zh-CN: 进程同时在内存中持有的查询结果字节数上限（各调用合计，按读出的行计，调用结束释放），超出时读取以预算超限失败，写操作与过程（写已生效）只返回已读取的行并标记 truncated；默认 256 MiB。
  en: >-
    Bytes of query results the process holds in memory at once (all calls together, counted as rows are read and
    released when a call ends); a read past it fails as over budget, while a write or a procedure (which took
    effect) returns the rows read so far, marked truncated. Default 256 MiB.
rateLimit.connMaxIdleTime:
  zh-CN: 数据库连接最长空闲时间。
  en: Maximum idle time of a database connection.
rateLimit.connMaxLifetime:
  zh-CN: 数据库连接最长存活时间。
  en: Maximum lifetime of a database connection.

mask:
  title: {zh-CN: '脱敏', en: 'Masking'}
  zh-CN: 字段脱敏。
  en: Field masking.
mask.enabled:
  zh-CN: 是否对配置了 mask 的字段脱敏。
  en: Mask fields that declare a mask rule.

audit:
  title: {zh-CN: '审计', en: 'Audit'}
  zh-CN: 审计日志，以 JSON Lines 追加写入。
  en: Audit log, appended as JSON Lines.
audit.enabled:
  zh-CN: 是否写审计日志；启用时必须设置 path。
  en: Write the audit log; path is required when enabled.
audit.path:
  zh-CN: 审计日志文件路径。
  en: Audit log file.
audit.queueSize:
  zh-CN: 异步写入队列长度；队列满时丢弃事件并计数。
  en: Asynchronous write queue length; events are dropped and counted when it is full.

transactions:
  title: {zh-CN: '事务', en: 'Transactions'}
  zh-CN: 事务工具的限制。begin 可指定 datasource、isolation 与 readOnly；只有具备写权限的角色能请求 readOnly false。
  en: Limits of the transaction tools. begin takes datasource, isolation and readOnly; only roles with write access may ask for readOnly false.
transactions.ttl:
  zh-CN: 事务最长存活时间。
  en: Maximum transaction lifetime.
transactions.idleTimeout:
  zh-CN: 事务空闲超时：超过这么久没有执行语句的事务由服务端回滚，释放它持有的锁和连接；避免 Agent 思考期间长期持锁而卡住表结构变更（DDL）及排在其后的查询。
  en: Idle timeout of a transaction; one that runs no statement for this long is rolled back by the server, releasing the locks and the connection it holds, so an agent thinking between calls does not hold up schema changes (DDL) and the queries queued behind them.
transactions.maxOpen:
  zh-CN: 每个角色/subject 同时打开的事务上限。
  en: Open transactions per role/subject.
transactions.maxOpenPerConnection:
  zh-CN: 同一个数据库连接上同时打开的事务上限，所有角色合计；未设置时取 rateLimit.ioPool 的一半（至少 1），给普通查询留出连接池的另一半。
  en: "Open transactions holding one database connection, all roles together; unset: half of rateLimit.ioPool (at least 1), leaving queries the other half of the pool."
transactions.beginTimeout:
  zh-CN: 开启事务超时。
  en: Begin timeout.
transactions.commitTimeout:
  zh-CN: 提交超时。
  en: Commit timeout.
transactions.rollbackTimeout:
  zh-CN: 回滚超时。
  en: Rollback timeout.

execution:
  title: {zh-CN: '执行总线', en: 'Execution bus'}
  zh-CN: 工具调用以外的数据库执行的通道上限；所有通道共享 rateLimit.ioPool，这些通道合计最多占用其一半。
  en: Lanes of database work other than tool calls; all lanes share rateLimit.ioPool and these together hold at most half of it.
execution.admin:
  zh-CN: 管理员请求内的读取（模式列表、表注释、导入）。
  en: Reads answering an administrator's request (schema lists, table comments, imports).
execution.admin.maxConcurrent:
  zh-CN: 同时执行的上限。
  en: Work running at once.
execution.admin.maxQueue:
  zh-CN: 排队等待的上限；超过时立即返回繁忙。
  en: Work waiting; beyond it requests fail as busy at once.
execution.scan:
  zh-CN: 模式扫描与扫描批次。
  en: Schema scans and scan batches.
execution.scan.maxConcurrent:
  zh-CN: 同时执行的扫描上限。
  en: Scans running at once.
execution.scan.maxQueue:
  zh-CN: 排队等待的扫描上限。
  en: Scans waiting.
execution.background:
  zh-CN: 无人等待的后台工作，如能力评估与装配期自省。
  en: Work nobody waits for, such as capability assessment and introspection while assembling.
execution.background.maxConcurrent:
  zh-CN: 同时执行的上限。
  en: Work running at once.
execution.background.maxQueue:
  zh-CN: 排队等待的上限。
  en: Work waiting.
