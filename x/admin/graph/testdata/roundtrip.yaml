# Sets every editable field so the draft round trip in graph_test covers it;
# TestRoundTripFixtureCoversEveryField fails when a configuration field is
# missing here.
databases:
  shop:
    driver: postgres
    dsn: ${SHOP_DSN}
    sqlEscape: {connection: default}
entities:
  - name: customers
    source: customer_master
    datasource: shop
    schema: crm
    kind: view
    description: Customer master
    primaryKey: [id]
    fields:
      - name: id
      - {name: region, alias: area, description: Sales region}
      - {name: phone, mask: phone}
      - {name: secret_col, exclude: true}
    roles:
      read: [legacy_reader]
      create: [legacy_writer]
      update: [legacy_writer]
      delete: [legacy_writer]
      execute: [legacy_writer]
      aggregate: [legacy_reader]
    fieldACL:
      legacy_reader: {read: [id, region], write: [region]}
    rowPolicies:
      legacy_reader: {field: region, op: eq, value: CN}
    tenantPolicy: {field: region, op: eq, value: "${subject.tenant}"}
    mcp: {dmlTools: false}
    relationships:
      - name: orders
        target: orders
        cardinality: has-many
        joinOn: {id: customer_id}
  - name: orders
    datasource: shop
    uniqueKeys: [[customer_id]]
    allowCascade: true
    allowKeyUpdate: true
    fields:
      - name: id
      - name: customer_id
  - name: refresh
    datasource: shop
    kind: procedure
    params: [tenant]
    affects: [orders]
    mcp: {customTool: true, trustedProcedure: true}
roles:
  analyst:
    description: Business analyst
    grants:
      - entity: orders
        actions: [read, aggregate]
        fields: {read: [id], write: [customer_id]}
        rows: {or: [{field: customer_id, op: gt, value: 10}, {field: id, op: is_null}]}
    permissions: ["sql:execute@shop"]
    limits:
      maxRows: 200
      maxBytes: 1048576
      maxScannedRows: 50000
      queryTimeout: 5s
      softScore: 40
      hardScore: 20
      rejectFullScan: true
      rps: 2.5
      maxInflight: 3
      budget: {maxConcurrent: 2, maxSessionCost: 100}
users:
  alice:
    description: BI agent
    tokenHash: sha256:1111111111111111111111111111111111111111111111111111111111111111
    certSubjects: ["cn:alice", "uri:spiffe://example.org/agent/alice"]
    roles: [analyst]
    subject: {tenant: t1, level: 3}
    grants:
      - entity: refresh
        actions: [execute]
    permissions: ["sql:execute@shop"]
    disabled: true
    limits: {maxRows: 50, budget: {maxExecution: 2s}}
cost:
  maxRows: 500
  maxScannedRows: 2000000
  allowTemplates: ["shop:CALL refresh(?)"]
budget:
  users:
    alice: {maxConcurrent: 2}
execution:
  admin: {maxConcurrent: 3, maxQueue: 9}
  scan: {maxConcurrent: 1, maxQueue: 4}
  background: {maxConcurrent: 1, maxQueue: 32}
