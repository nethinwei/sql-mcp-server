# gqlgen configuration; regenerate with `go generate ./x/admin/graph`.
schema:
  - schema.graphqls
  - planning.graphqls
exec:
  filename: generated.go
  package: graph
model:
  filename: models_gen.go
  package: graph
resolver:
  layout: follow-schema
  dir: .
  package: graph
  filename_template: "{name}.resolvers.go"
omit_slice_element_pointers: true
# The configuration service's results and inputs bind by name, through the
# aliases of app_types.go.
autobind:
  - github.com/nethinwei/sql-mcp-server/x/admin/graph
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  JSON:
    model:
      - github.com/99designs/gqlgen/graphql.Any
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  # Enums the configuration service returns as plain strings (their values
  # are validated against the schema by the GraphQL layer).
  Action:
    model:
      - github.com/99designs/gqlgen/graphql.String
  Field:
    model:
      - github.com/nethinwei/sql-mcp-server/x/admin/configapp.FieldItem
  ScanState:
    model:
      - github.com/99designs/gqlgen/graphql.String
  TableStatus:
    model:
      - github.com/99designs/gqlgen/graphql.String
  Workspace:
    fields:
      sections:
        resolver: true
      items:
        resolver: true
      conflicts:
        resolver: true
  Revision:
    model:
      - github.com/nethinwei/sql-mcp-server/x/admin/graph.Revision
    fields:
      config:
        resolver: true
      sections:
        resolver: true
      yaml:
        resolver: true
