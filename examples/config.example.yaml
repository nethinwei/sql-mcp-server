# SQL MCP Server example configuration.
# Explicit CLI transport/addr flags override these YAML values:
#   sql-mcp-server serve --config config.yaml --transport stdio
#   sql-mcp-server serve --config config.yaml --transport http \
#     --addr 127.0.0.1:8080 --watch --watch-interval 1s
version: "1"

server:
  # Used unless the corresponding serve flag is provided.
  transport: stdio
  addr: "127.0.0.1:8080"
  role: reader
  # Default user for calls without a user identity; wins over role. Must name
  # a configured, enabled user (see users below).
  user: ""
  # An HTTP MCP session idle this long is closed; the client then opens a new
  # one (its transactions and session budget do not carry over).
  sessionTimeout: 30m
  # Behind a gateway serving this under a path it strips (e.g. /sql-mcp), and
  # the MCP endpoint as clients reach it; the console builds client
  # configuration from publicURL.
  pathPrefix: ""
  publicURL: ""
  secrets:
    allowedRoots: [/run/secrets, /var/run/secrets]
  auth:
    # Required for non-loopback HTTP unless mTLS is enabled. This value is
    # literal: unlike DSNs, auth fields do not resolve ${ENV} placeholders.
    token: ""
    # Enable only behind a gateway that authenticates callers, strips incoming
    # X-MCP-User/X-MCP-Role/X-MCP-Subject, and injects trusted replacements.
    # X-MCP-Role names a role; a user is named with X-MCP-User.
    trustProxyHeaders: false
    # trustProxyHeaders needs one of these to tell the proxies: their source
    # addresses, or, under mTLS, their client certificates (leaf CN or DNS
    # SAN). Any other client certificate is a caller, not a proxy.
    trustedProxyCIDRs: []
    trustedProxyCertSubjects: []
    tls:
      cert: ""
      key: ""
      clientCA: "" # setting this enables mTLS and requires cert + key
      # With users, a client certificate without a token must name a user
      # (users.*.certSubjects); "default" serves it as the default identity.
      clientIdentity: user

# Use "database" for one legacy/default source, or "databases" for named sources.
databases:
  primary:
    driver: postgres # postgres | mysql | oceanbase
    # Every ${...} placeholder in a DSN is resolved at startup.
    dsn: "postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:5432/${PGDATABASE}?sslmode=require"
  analytics:
    driver: mysql
    # MySQL/OceanBase use go-sql-driver/mysql DSN syntax.
    dsn: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/${MYSQL_DATABASE}?parseTime=true"
    # A whole DSN can instead come from a mounted secret:
    # dsn: "${file:/run/secrets/analytics_dsn}"
  warehouse:
    driver: postgres
    # Several connections instead of dsn: accounts with different privileges
    # or replicas (role: replica serves reads only), chosen by routing.
    connections:
      replica:
        dsn: "postgres://${WH_RO_USER}:${WH_RO_PASSWORD}@${WH_REPLICA_HOST}:5432/warehouse"
        role: replica
      writer:
        dsn: "postgres://${WH_RW_USER}:${WH_RW_PASSWORD}@${WH_HOST}:6432/warehouse"
        # Behind a transaction-mode pooler (pgbouncer): no session state is
        # kept, and the statement timeout is best effort (see
        # cost.requireNativeLimits).
        pooler: transaction
    routing:
      read: replica
      write: writer
      execute: writer
    # A session's reads use the write connection this long after it writes.
    readAfterWrite: 5s
    # Admits the trusted SQL escape hatch (tools.executeSql) on this
    # connection; omitted, no permission runs SQL here.
    sqlEscape:
      connection: replica

tools:
  describeEntities: true
  readRecords: true
  # The writing tools are off when the tools section is omitted.
  createRecord: true
  updateRecord: true
  deleteRecord: false
  executeEntity: true
  aggregateRecords: true
  beginTransaction: true
  commitTransaction: true
  rollbackTransaction: true
  # execute_sql, the trusted SQL escape hatch: also needs audit.enabled, a
  # datasource's sqlEscape and sql:execute@<datasource> (see roles/users).
  executeSql: false

cost:
  enabled: true
  softScore: 60 # score is 0-100; higher is safer
  hardScore: 40 # [hard, soft) is a soft reject; below hard is hard reject
  maxRows: 10000 # deterministic outer LIMIT for read-only SQL
  maxBytes: 16777216 # hard response-size cap
  maxScannedRows: 100000 # refuse statements estimated to read more rows (0 = unlimited)
  maxINListSize: 256
  maxFilterConditions: 32
  maxGroupByFields: 8
  maxAggregates: 16
  maxExpand: 8
  maxProcedureRows: 1000
  rejectFullScan: true
  whitelistPKPoint: true
  requirePKForWrite: true
  requireKnownScan: true
  requireFreshStats: false
  queryTimeout: 30s # 0 (none) or at least 100ms
  # Strict mode: refuse a configuration whose connections cannot stop
  # statements at queryTimeout on the database side; off, it only warns.
  requireNativeLimits: false
  fullScanMaxRows: 1000 # full scans of tables this small are not rejected
  sqlEscape:
    estimate: required # required | skip: EXPLAIN execute_sql statements first
    metadata: allow # allow | refuse: SHOW/DESCRIBE <table> without an estimate
  # Prefer datasource-scoped fp:v4:<sha256> values from reviewed generated SQL.
  allowTemplates: []
  rejectTemplates: []
  aqe:
    windowSize: 32
    anomalyFactor: 3
    anomalyMinSamples: 5
    maxFingerprints: 4096
    explainAnalyze: false # PostgreSQL only; executes the read-only query once more
    readOnly: true # must remain true when explainAnalyze is enabled
    sampleRate: 0 # 0..1; opt in with a small non-zero rate
    timeout: 1s # independent sampling timeout; maximum 5s

budget:
  roles:
    reader:
      maxConcurrent: 8
      maxExecution: 20s
      maxEstimatedScannedRows: 50000
      maxReturnedRows: 10000
      maxReturnedBytes: 16777216
      maxSessionCost: 100000
  tenants:
    tenant-demo:
      maxConcurrent: 4
      maxExecution: 10s
      maxEstimatedScannedRows: 20000
      maxReturnedRows: 5000
      maxReturnedBytes: 8388608
      maxSessionCost: 50000
  users:
    alice:
      maxConcurrent: 2
      maxExecution: 10s
      maxEstimatedScannedRows: 20000
      maxReturnedRows: 5000
      maxReturnedBytes: 8388608
      maxSessionCost: 50000

cache:
  enabled: true
  ttl: 30s
  maxSize: 1000
  maxEntryRows: 10000
  maxEntryBytes: 16777216
  maxTotalBytes: 268435456   # all entries together; past it the ones closest to expiry go
  preparedMaxSize: 128

rateLimit:
  enabled: true
  rps: 100
  maxInflight: 256
  ioPool: 16 # also bounds DB MaxOpenConns
  minConcurrency: 1
  rttThreshold: 0s
  breakerThreshold: 5
  breakerCooldown: 5s
  connMaxIdleTime: 5m
  connMaxLifetime: 30m
  maxResultMemory: 268435456 # result bytes held in memory by all calls together

mask:
  enabled: true

audit:
  enabled: false
  path: "./sql-mcp-audit.jsonl"
  queueSize: 1024

transactions:
  ttl: 5m
  idleTimeout: 1m # rolled back after this long without a statement
  maxOpen: 128
  beginTimeout: 5s
  commitTimeout: 30s
  rollbackTimeout: 30s
  maxOpenPerConnection: 8 # transactions holding one connection

# Database work other than tool calls; these lanes together hold at most half
# of rateLimit.ioPool.
execution:
  admin: {maxConcurrent: 4, maxQueue: 16} # reads for administrators' requests
  scan: {maxConcurrent: 2, maxQueue: 8} # schema scans and scan batches
  background: {maxConcurrent: 2, maxQueue: 64}

# Grant model: roles hold grants (entity, actions, field and row scopes) and
# system permissions; users authenticate with their own tokens.
roles:
  analyst:
    description: "Reads the orders of the caller's tenant"
    grants:
      - entity: orders
        actions: [read, aggregate]
        fields: {read: [id, user_id, total], write: []}
        rows: {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
    # sql:execute@<datasource> admits execute_sql there.
    permissions: []
    # Tighten the global limits for this role's calls (unset fields keep
    # them); a user's own limits win over its roles'.
    limits:
      maxRows: 500
      maxBytes: 1048576
      maxScannedRows: 50000
      queryTimeout: 5s
      softScore: 40
      hardScore: 20
      rejectFullScan: true
      rps: 5
      maxInflight: 4
      budget:
        maxConcurrent: 2
        maxExecution: 30s
        maxEstimatedScannedRows: 1000000
        maxReturnedRows: 10000
        maxReturnedBytes: 10485760
        maxSessionCost: 1000

users:
  alice:
    description: "Analyst of tenant-demo"
    # From `sql-mcp-server user token`; the plaintext never enters the config.
    tokenHash: "sha256:6d593566435e956df597c1110116613303484f8a21dfcdaefeeb87563a17d2f3"
    # Under mTLS, a client certificate naming one of these is alice.
    certSubjects: ["uri:spiffe://example.org/agent/alice"]
    roles: [analyst]
    subject: {tenant_id: tenant-demo} # wins over a proxy's X-MCP-Subject
    grants:
      - entity: users
        actions: [read]
        fields: {read: [id, email], write: []}
        rows: {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
    permissions: []
    disabled: false
    # A user's own limits win over its roles', field by field.
    limits:
      {maxRows: 100, maxBytes: 262144, maxScannedRows: 20000, queryTimeout: 3s, softScore: 50, hardScore: 30, rejectFullScan: true,
       rps: 1, maxInflight: 1, budget: {maxConcurrent: 1, maxExecution: 10s, maxEstimatedScannedRows: 100000,
       maxReturnedRows: 1000, maxReturnedBytes: 1048576, maxSessionCost: 100}}

entities:
  - name: users
    source: app_user
    datasource: primary
    schema: public
    kind: table
    description: "Registered users"
    primaryKey: [id]
    uniqueKeys: [[email]] # identify one row like the primary key
    # Cascading writes (foreign keys rewriting other tables) need delete or
    # update permission on every cascaded entity unless this is true.
    allowCascade: false
    # update_records may not change the primary key unless this is true.
    allowKeyUpdate: false
    mcp:
      dmlTools: true
      customTool: false
    roles:
      read: [reader, writer, admin]
      create: [writer, admin]
      update: [writer, admin]
      delete: [admin]
      aggregate: [reader, writer, admin]
    fieldACL:
      reader:
        read: [id, tenant_id, email, createdAt]
        write: []
    rowPolicies:
      reader:
        and:
          - {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
    relationships:
      - name: orders
        target: orders
        cardinality: many
        joinOn: {id: user_id}
    fields:
      - {name: id, description: "User ID"}
      - {name: tenant_id, description: "Tenant ID"}
      - {name: email, description: "Email address", mask: email}
      - {name: phone, description: "Hidden phone", exclude: true}
      - {name: created_at, alias: createdAt, description: "Registration time"}

  - name: orders
    source: orders
    datasource: primary # relationships must stay on the same datasource
    schema: public
    kind: table
    primaryKey: [id]
    roles:
      read: [reader, writer, admin]
      aggregate: [reader, writer, admin]
    # A tenant boundary ANDed for every principal, never merged across roles.
    tenantPolicy: {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
    fields:
      - {name: id}
      - {name: user_id}
      - {name: tenant_id}
      - {name: total}

  - name: refresh_reporting
    source: refresh_reporting
    datasource: analytics
    kind: procedure
    params: [tenant_id]
    # Entities the procedure writes, for read-cache invalidation; omitted,
    # every cached read of the datasource is invalidated after it runs.
    affects: []
    roles:
      execute: [admin]
    mcp:
      dmlTools: true
      customTool: true
      # Set true only after DBA review and add the generated CALL fingerprint
      # to cost.allowTemplates.
      trustedProcedure: false
