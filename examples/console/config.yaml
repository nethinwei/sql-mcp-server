# Initial configuration imported into the config store for the console demo:
# one datasource of each supported kind, each a business of its own that
# shows every feature (README.md lists which table shows what).
#   shop       PostgreSQL  e-commerce   init.sql
#   warehouse  MySQL       warehousing  mysql-init.sql
#   ledger     OceanBase   bookkeeping  ob-init.sql
# Entities, roles and users are then managed in the admin console;
# datasources stay in this file (the console never handles credentials). One
# schema of each datasource is left out on purpose: import it from the console.
#
# Descriptions: an entity or field without one uses the database comment, so
# only overrides are written here (sales.orders.amount, for example).
#
# Entities are named like their tables, in the namespace datasource.schema:
# shop.crm.tenants, warehouse.logistics.tenants and ledger.ledger.tenants are
# three entities. A reference (grants, relationships, affects) is the shortest
# suffix naming one entity: "tenants" alone would be ambiguous, so it is
# written crm.tenants; publishing rejects an ambiguous reference.
version: "1"

server:
  transport: http
  addr: "0.0.0.0:8080"

databases:
  # Each datasource reaches its database through two accounts: reads go to
  # the read-only one (a replica); writes, procedures and a session's reads
  # for 5s after it writes go to the read-write one.
  shop:
    driver: postgres
    connections:
      reader:
        role: replica
        dsn: "postgres://shop_ro:${PG_READER_PASSWORD}@${PG_HOST}/shop?sslmode=disable"
      writer:
        dsn: "postgres://shop_rw:${PG_WRITER_PASSWORD}@${PG_HOST}/shop?sslmode=disable"
    routing: {read: reader, write: writer, execute: writer}
    readAfterWrite: 5s
  warehouse:
    driver: mysql
    connections:
      reader:
        role: replica
        dsn: "warehouse_ro:${MYSQL_READER_PASSWORD}@tcp(${MYSQL_HOST})/inventory?parseTime=true"
      writer:
        dsn: "warehouse_rw:${MYSQL_WRITER_PASSWORD}@tcp(${MYSQL_HOST})/inventory?parseTime=true"
    routing: {read: reader, write: writer, execute: writer}
    readAfterWrite: 5s
  ledger:
    driver: oceanbase
    connections:
      reader:
        role: replica
        dsn: "ledger_ro:${OB_READER_PASSWORD}@tcp(${OB_HOST})/ledger?parseTime=true"
      writer:
        dsn: "ledger_rw:${OB_WRITER_PASSWORD}@tcp(${OB_HOST})/ledger?parseTime=true"
    routing: {read: reader, write: writer, execute: writer}
    readAfterWrite: 5s

tools:
  describeEntities: true
  readRecords: true
  aggregateRecords: true
  createRecord: true
  updateRecord: true
  deleteRecord: true
  executeEntity: true
  beginTransaction: true
  commitTransaction: true
  rollbackTransaction: true

cost:
  enabled: true
  maxRows: 200
  rejectFullScan: true
  whitelistPKPoint: true
  queryTimeout: 5s
  # A procedure runs only when trusted and its CALL is allowed here.
  allowTemplates:
    - 'shop:CALL "crm"."close_ticket"($1)'
    - "warehouse:CALL `inventory`.`restock`(?, ?, ?)"
    - "ledger:CALL `ledger`.`post_entry`(?, ?, ?)"

budget:
  roles:
    analyst:
      maxConcurrent: 4
      maxExecution: 10s
      maxEstimatedScannedRows: 100000
      maxReturnedRows: 500
    support:
      maxConcurrent: 2
      maxExecution: 5s
      maxEstimatedScannedRows: 5000
      maxReturnedRows: 50

entities:
  # crm
  - name: tenants
    datasource: shop
    schema: crm
    source: tenants
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: name}
      - {name: plan}
      - {name: created_at}

  - name: customers
    datasource: shop
    schema: crm
    source: customers
    primaryKey: [id]
    # Hard tenant boundary: every caller only ever sees its own tenant.
    tenantPolicy: {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: name}
      - {name: email, mask: email}
      - {name: phone, mask: phone}
      - {name: id_card, mask: idcard}
      - {name: region}
      - {name: vip_level}
      - {name: created_at}
    relationships:
      - {name: orders, target: sales.orders, cardinality: many, joinOn: {id: customer_id}}
      - {name: tickets, target: support_tickets, cardinality: many, joinOn: {id: customer_id}}

  - name: support_tickets
    datasource: shop
    schema: crm
    source: support_tickets
    primaryKey: [id]
    tenantPolicy: {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: customer_id}
      - {name: subject}
      - {name: status}
      - {name: priority}
      - {name: created_at}
      - {name: closed_at}
      - {name: order_id}
    relationships:
      - {name: customer, target: customers, cardinality: belongs-to, joinOn: {customer_id: id}}
      - {name: order, target: sales.orders, cardinality: belongs-to, joinOn: {order_id: id}}

  # A stored procedure, exposed as its own MCP tool.
  - name: close_ticket
    datasource: shop
    schema: crm
    source: close_ticket
    kind: procedure
    params: [p_ticket]
    affects: [support_tickets]
    mcp: {customTool: true, trustedProcedure: true}

  # sales
  - name: products
    datasource: shop
    schema: sales
    source: products
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: sku}
      - {name: name}
      - {name: category}
      - {name: price}
      - {name: cost_price}
      - {name: active}

  - name: orders
    datasource: shop
    schema: sales
    source: orders
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: customer_id}
      - {name: status}
      - {name: amount, description: "订单实付金额（元，含税，已扣优惠）"}
      - {name: currency}
      - {name: region}
      - {name: channel}
      - {name: created_at, alias: createdAt}
      - {name: paid_at, alias: paidAt}
    relationships:
      - {name: customer, target: customers, cardinality: belongs-to, joinOn: {customer_id: id}}
      - {name: items, target: order_items, cardinality: many, joinOn: {id: order_id}}
      - {name: refunds, target: refunds, cardinality: many, joinOn: {id: order_id}}

  - name: order_items
    datasource: shop
    schema: sales
    source: order_items
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: order_id}
      - {name: line_no}
      - {name: product_id}
      - {name: quantity}
      - {name: unit_price}
      - {name: discount}
    relationships:
      - {name: order, target: sales.orders, cardinality: belongs-to, joinOn: {order_id: id}}
      - {name: product, target: products, cardinality: belongs-to, joinOn: {product_id: id}}

  - name: refunds
    datasource: shop
    schema: sales
    source: refunds
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: order_id}
      - {name: amount}
      - {name: reason}
      - {name: status}
      - {name: created_at}
    relationships:
      - {name: order, target: sales.orders, cardinality: belongs-to, joinOn: {order_id: id}}

  # archive: same table name as sales.orders, a different schema; references
  # say which (sales.orders, archive.orders)
  - name: orders
    datasource: shop
    schema: archive
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: customer_id}
      - {name: amount}
      - {name: created_at}

  - name: open_orders
    datasource: shop
    schema: sales
    source: v_open_orders
    kind: view
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: customer_id}
      - {name: status}
      - {name: amount}
      - {name: created_at}

  # partitioned by half-year; the partitions are not entities
  - name: daily_kpi
    datasource: shop
    schema: sales
    source: daily_kpi
    primaryKey: [day, tenant_id]
    fields:
      - {name: day}
      - {name: tenant_id}
      - {name: gmv}
      - {name: orders}
      - {name: new_buyers}
      - {name: refund_rate}


  # warehouse (MySQL) ----------------------------------------------------------
  # Same table name as shop's crm.tenants and ledger's ledger.tenants: another
  # datasource, another database, another entity named tenants.
  - name: tenants
    datasource: warehouse
    schema: logistics
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: name}
      - {name: contact}

  - name: items
    datasource: warehouse
    schema: inventory
    source: items
    primaryKey: [sku]
    fields:
      - {name: sku}
      - {name: title}
      - {name: description}
      - {name: barcode}
      - {name: gtin}
    relationships:
      - {name: stock, target: stock, cardinality: many, joinOn: {sku: sku}}

  - name: stock
    datasource: warehouse
    schema: inventory
    source: stock
    primaryKey: [warehouse_id, sku]
    fields:
      - {name: warehouse_id}
      - {name: sku}
      - {name: quantity}
      - {name: updated_at}
    relationships:
      - {name: item, target: items, cardinality: belongs-to, joinOn: {sku: sku}}

  - name: stock_daily
    datasource: warehouse
    schema: inventory
    source: stock_daily
    primaryKey: [day, warehouse_id]
    fields:
      - {name: day}
      - {name: warehouse_id}
      - {name: inbound}
      - {name: outbound}

  - name: low_stock
    datasource: warehouse
    schema: inventory
    source: v_low_stock
    kind: view
    fields:
      - {name: warehouse_id}
      - {name: sku}
      - {name: quantity}

  - name: restock
    datasource: warehouse
    schema: inventory
    source: restock
    kind: procedure
    params: [p_warehouse, p_sku, p_quantity]
    affects: [stock]
    mcp: {customTool: true, trustedProcedure: true}
    # The columns of the result it returns; others are not returned.
    fields:
      - {name: warehouse_id}
      - {name: sku}
      - {name: quantity}

  - name: waybills
    datasource: warehouse
    schema: logistics
    source: waybills
    primaryKey: [id]
    tenantPolicy: {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: warehouse_id}
      - {name: carrier_id}
      - {name: tracking_no}
      - {name: receiver_phone, mask: phone}
      - {name: shipped_at}

  # archive: same table name as logistics.waybills, another database
  - name: waybills
    datasource: warehouse
    schema: archive
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: tracking_no}
      - {name: shipped_at}

  # ledger (OceanBase) ---------------------------------------------------------
  - name: tenants
    datasource: ledger
    schema: ledger
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: name}
      - {name: tax_id}

  - name: accounts
    datasource: ledger
    schema: ledger
    primaryKey: [id]
    tenantPolicy: {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: name}
      - {name: account_no, mask: secret}
      - {name: currency}
      - {name: balance}
    relationships:
      - {name: entries, target: entries, cardinality: many, joinOn: {id: account_id}}

  - name: entries
    datasource: ledger
    schema: ledger
    primaryKey: [id]
    tenantPolicy: {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: account_id}
      - {name: amount}
      - {name: memo}
      - {name: created_at}
    relationships:
      - {name: account, target: accounts, cardinality: belongs-to, joinOn: {account_id: id}}

  - name: statements
    datasource: ledger
    schema: billing
    source: statements
    primaryKey: [period_start, account_id]
    fields:
      - {name: period_start}
      - {name: account_id}
      - {name: opening}
      - {name: closing}

  - name: account_overview
    datasource: ledger
    schema: ledger
    source: v_accounts
    kind: view
    primaryKey: [account_id]
    tenantPolicy: {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
    fields:
      - {name: account_id}
      - {name: tenant_id}
      - {name: name}
      - {name: currency}
      - {name: balance}
      - {name: branch}

  - name: post_entry
    datasource: ledger
    schema: ledger
    source: post_entry
    kind: procedure
    params: [p_account, p_amount, p_memo]
    affects: [entries, accounts]
    mcp: {customTool: true, trustedProcedure: true}
    fields:
      - {name: account_id}
      - {name: balance}

  # archive: same table name as ledger.entries, another database. Named
  # differently here: in a datasource called like its schema, ledger.entries
  # would name both, so the main table would need its full ID.
  - name: archive_entries
    datasource: ledger
    schema: archive
    source: entries
    primaryKey: [id]
    fields:
      - {name: id}
      - {name: tenant_id}
      - {name: account_id}
      - {name: amount}
      - {name: created_at}

roles:
  analyst:
    description: 平台经营分析：跨租户的交易与经营指标，不含个人信息与成本价
    grants:
      - entity: sales.orders
        actions: [read, aggregate]
        fields: {read: [id, tenant_id, status, amount, currency, region, channel, created_at, paid_at]}
      - entity: order_items
        actions: [read, aggregate]
      - entity: products
        actions: [read, aggregate]
        fields: {read: [id, tenant_id, sku, name, category, price, active]}
      - entity: refunds
        actions: [read, aggregate]
      - entity: daily_kpi
        actions: [read, aggregate]
      - entity: open_orders
        actions: [read, aggregate]
      - entity: archive.orders
        actions: [aggregate]
      - entity: crm.tenants
        actions: [read]

  support:
    description: 商家客服：本租户的客户（个人信息脱敏）、订单与工单
    grants:
      - entity: customers
        actions: [read]
        fields: {read: [id, name, email, phone, region]}
      - entity: support_tickets
        actions: [read, update]
        fields:
          read: [id, customer_id, order_id, subject, status, priority, created_at, closed_at]
          write: [status, priority]
      - entity: close_ticket
        actions: [execute]
      - entity: sales.orders
        actions: [read]
        fields: {read: [id, customer_id, status, amount, created_at, paid_at]}
        rows:
          and:
            - {op: eq, field: tenant_id, value: "${subject.tenant_id}"}
            - {op: ne, field: status, value: cancelled}
      # refunds has no tenant column, so support may file refunds but not list them.
      - entity: refunds
        actions: [create]
        fields: {write: [order_id, amount, reason, status]}

  marketing:
    description: 会员运营：客户分层，不可见联系方式
    grants:
      - entity: customers
        actions: [read, aggregate]
        fields: {read: [id, name, region, vip_level, created_at]}

  finance:
    description: 平台财务：跨租户的订单、退款与成本价
    grants:
      - entity: sales.orders
        actions: [read, aggregate]
        rows: {op: in, field: status, value: [paid, shipped, completed]}
      - entity: refunds
        actions: [read, aggregate, create, delete]
        fields:
          read: [id, order_id, amount, reason, status, created_at]
          write: [order_id, amount, reason, status]
      - entity: products
        actions: [read]

  ops:
    description: 仓储运营（MySQL）：商品与库存、补货、本货主的运单（收件人手机号脱敏）
    grants:
      - entity: items
        actions: [read]
      - entity: stock
        actions: [read, aggregate, update]
        fields: {read: [warehouse_id, sku, quantity, updated_at], write: [quantity]}
      - entity: stock_daily
        actions: [read, aggregate]
      - entity: low_stock
        actions: [read]
      - entity: restock
        actions: [execute]
      - entity: logistics.waybills
        actions: [read, aggregate, create, delete]
        fields:
          read: [id, tenant_id, warehouse_id, carrier_id, tracking_no, receiver_phone, shipped_at]
          write: [tenant_id, warehouse_id, carrier_id, tracking_no, receiver_phone, shipped_at]
      - entity: archive.waybills
        actions: [read, aggregate]
      - entity: logistics.tenants
        actions: [read]

  bookkeeper:
    description: 记账（OceanBase）：本租户的账户（账号脱敏）、分录与对账单
    grants:
      - entity: accounts
        actions: [read]
      - entity: entries
        actions: [read, aggregate, create, update, delete]
        fields:
          read: [id, tenant_id, account_id, amount, memo, created_at]
          write: [tenant_id, account_id, amount, memo]
      - entity: account_overview
        actions: [read]
      - entity: statements
        actions: [read, aggregate]
      - entity: post_entry
        actions: [execute]
      - entity: archive_entries
        actions: [aggregate]
      - entity: ledger.tenants
        actions: [read]

# MCP callers. LOCAL EXAMPLE ONLY: the matching tokens are listed in README.md;
# generate your own with `sql-mcp-server user token` or in the console.
users:
  bi-agent:
    description: 平台 BI 分析 Agent（跨租户，看不到客户个人信息）
    tokenHash: "sha256:4f2018d77b836ba3533a8ef8b738b502ad814f473a8eb3fa87533d887ecd8ebc"
    roles: [analyst]
  support-agent:
