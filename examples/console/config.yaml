    tokenHash: "sha256:83c98225d57d8c44e6925825bc733e9afa066579bd85d71c54b7ea0d92796993"
    roles: [support, marketing]
    subject: {tenant_id: 1}
  finance-bot:
    description: 平台对账机器人
    tokenHash: "sha256:c58f00de71ecb3fc587ce7d18acc4f395112c2c267d3ea84dfd225cd506df3b6"
    roles: [finance]
    grants:
      - entity: archive.orders
        actions: [read, aggregate]
  ops-agent:
    description: 仓储运营 Agent（MySQL，货主 1）
    tokenHash: "sha256:0a11af364eb4ddfbb8a932c6b030cf15b13c5c786d156af631bc01bc276748cf"
    roles: [ops]
    subject: {tenant_id: 1}
  ledger-agent:
    description: 记账 Agent（OceanBase，租户 1）
    tokenHash: "sha256:3157e6b8db95eb284d0bb19b1451a9e40416a926b74fc717350369cf333f22f7"
    roles: [bookkeeper]
    subject: {tenant_id: 1}
  legacy-bot:
    description: 已停用的旧报表脚本
    tokenHash: "sha256:218fdd3ff94b4e8b0d9367791623c5691f451b82de37fb5831dcce72bc4e2479"
