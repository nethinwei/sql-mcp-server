    tokenHash: "sha256:dfad97dce503c2883a306f5b294866512aa7f3bcb8af23ebba97fba43045184f"
    roles: [support]
    subject: {tenant_id: 2}
  crm-agent:
    description: 示例商户 A 的 CRM Agent，同时有客服与会员运营角色，两者可读字段不同
    tokenHash: "sha256:83c98225d57d8c44e6925825bc733e9afa066579bd85d71c54b7ea0d92796993"
    roles: [support, marketing]
    subject: {tenant_id: 1}
  finance-bot:
    description: 平台对账机器人
    tokenHash: "sha256:c58f00de71ecb3fc587ce7d18acc4f395112c2c267d3ea84dfd225cd506df3b6"
    roles: [finance]
    grants:
      - entity: archive_orders
        actions: [read, aggregate]
  legacy-bot:
    description: 已停用的旧报表脚本
    tokenHash: "sha256:218fdd3ff94b4e8b0d9367791623c5691f451b82de37fb5831dcce72bc4e2479"
